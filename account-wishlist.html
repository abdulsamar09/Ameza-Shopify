<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | AMEZA Account</title>
  <meta name="description" content="View and manage your saved wishlist items.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="icon" type="image/png" href="assets/amezashopify logo.png">
</head>
<body>

  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-left"><span class="top-bar-badge"><i class="fa-solid fa-tag"></i> Special Offer</span><span>Free Worldwide Express Shipping on all orders over $100</span></div>
      <div class="top-bar-right"><a href="account-orders.html" class="top-bar-link"><i class="fa-solid fa-clipboard-list"></i> Track Order</a><span style="opacity:0.4;">|</span><span class="top-bar-link"><i class="fa-solid fa-globe"></i> USD ($)</span></div>
    </div>
  </div>

  <header class="header-sticky">
    <div class="container header-inner">
      <a href="index.html" class="logo-wrap"><img src="assets/amezashopify logo.png" alt="AMEZA" onerror="this.style.display='none'"></a>
      <div class="header-actions">
        <a href="account.html" class="action-btn" title="My Account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        <a href="wishlist.html" class="action-btn" title="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
        <button class="action-btn hamburger-btn" data-action="mobile-menu-toggle" aria-label="Toggle Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content">

          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                Saved Wishlist
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <span id="wishlist-count-badge" class="twofa-status-badge disabled-badge"></span>
                <a href="wishlist.html" class="btn-section-action secondary" style="font-size: 0.8rem; padding: 6px 14px; text-decoration: none;">Full View</a>
              </div>
            </div>
            <div class="account-card-body">
              <div id="account-wishlist-container">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <footer class="footer-main" style="padding: 24px 0;"><div class="container"><div class="footer-bottom" style="border-top:none;padding-top:0;"><p>&copy; 2026 AMEZA. All rights reserved.</p><p class="footer-powered">Powered by <a href="https://techsyentra.com" target="_blank">techsyentra.com</a></p></div></div></footer>
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Currency Engine -->
  <script src="js/currency.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account-ui.js"></script>
  <script>
    const Auth = window.AmezaAuth;
    const UI = window.AccountUI;
    const user = UI.requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('account-sidebar').innerHTML = UI.sidebarHTML(user, 'wishlist');
    UI.initMobileSidebar();
    document.getElementById('sidebar-logout-btn').addEventListener('click', async () => {
      if (await UI.confirm({ title: 'Sign Out', description: 'Sign out?', confirmText: 'Sign Out', cancelText: 'Stay' })) {
        Auth.logout(); window.location.href = 'index.html';
      }
    });

    // Use the EXISTING ameza_wishlist key
    function getWishlist() {
      return JSON.parse(localStorage.getItem('ameza_wishlist') || '[]');
    }

    function saveWishlist(items) {
      localStorage.setItem('ameza_wishlist', JSON.stringify(items));
    }

    function getCart() {
      return JSON.parse(localStorage.getItem('ameza_cart') || '[]');
    }

    function saveCart(items) {
      localStorage.setItem('ameza_cart', JSON.stringify(items));
    }

    function renderWishlist() {
      const items = getWishlist();
      const container = document.getElementById('account-wishlist-container');
      const badge = document.getElementById('wishlist-count-badge');
      badge.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="account-empty-state">
            <div class="account-empty-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </div>
            <h3>Your wishlist is empty</h3>
            <p>Save items you love to find them again easily.</p>
            <a href="index.html" class="btn-section-action">Start Shopping</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="account-wishlist-grid">
          ${items.map(item => {
            const price = item.salePrice || item.price || 0;
            const originalPrice = item.price || 0;
            const onSale = item.salePrice && item.salePrice < item.price;
            return `
              <div style="border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: #FFFFFF; transition: var(--transition);" onmouseover="this.style.boxShadow='var(--shadow-hover)'" onmouseout="this.style.boxShadow='none'">
                <div style="position: relative; aspect-ratio: 1; background: var(--bg-page); overflow: hidden;">
                  <img src="${item.image || item.img || ''}" alt="${item.name || 'Product'}"
                    style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease;"
                    onerror="this.parentElement.style.background='var(--bg-page)'"
                    onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                  ${onSale ? `<div style="position:absolute; top:8px; left:8px; background:var(--badge-sale); color:#fff; font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:var(--radius-pill);">SALE</div>` : ''}
                  ${item.inStock === false ? `<div style="position:absolute; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center;"><span style="background:#fff; padding:4px 12px; border-radius:var(--radius-pill); font-size:0.78rem; font-weight:700; color:var(--dark);">Out of Stock</span></div>` : ''}
                </div>
                <div style="padding: 12px;">
                  <div style="font-size: 0.85rem; font-weight: 700; color: var(--dark); margin-bottom: 6px; line-height: 1.3;">${item.name || 'Product'}</div>
                  <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
                    <span style="font-weight: 800; color: var(--primary-dark);">${UI.formatPrice(price)}</span>
                    ${onSale ? `<span style="font-size: 0.78rem; color: var(--text-muted); text-decoration: line-through;">${UI.formatPrice(originalPrice)}</span>` : ''}
                  </div>
                  <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button class="btn-section-action" style="flex:1; font-size:0.78rem; padding:7px 10px; justify-content:center;" onclick="addWishlistItemToCart('${item.id}')" ${item.inStock === false ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                      ${item.inStock === false ? 'Out of Stock' : 'Add to Cart'}
                    </button>
                    <button class="btn-addr-action danger" style="flex-shrink:0;" onclick="removeFromWishlist('${item.id}')" aria-label="Remove from wishlist">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    window.removeFromWishlist = async (id) => {
      const confirmed = await UI.confirm({ title: 'Remove Item', description: 'Remove this item from your wishlist?', confirmText: 'Remove', dangerous: true, cancelText: 'Keep' });
      if (!confirmed) return;
      const items = getWishlist().filter(i => String(i.id) !== String(id));
      saveWishlist(items);
      renderWishlist();
      UI.toast('Removed from wishlist.', 'success');
    };

    window.addWishlistItemToCart = (id) => {
      const wishlist = getWishlist();
      const item = wishlist.find(i => String(i.id) === String(id));
      if (!item || item.inStock === false) return;

      const cart = getCart();
      const existing = cart.find(c => String(c.id) === String(id));
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({ ...item, quantity: 1 });
      }
      saveCart(cart);
      UI.toast(`${item.name || 'Item'} added to cart!`, 'success');
    };

    renderWishlist();
  </script>
</body>
</html>
