<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | AMEZA Account</title>
  <meta name="description" content="View your order details.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="icon" type="image/png" href="assets/amezashopify logo.png">
</head>
<body>

  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-left"><span class="top-bar-badge"><i class="fa-solid fa-tag"></i> Special Offer</span><span>Free Worldwide Express Shipping on all orders over $100</span></div>
      <div class="top-bar-right"><a href="account-orders.html" class="top-bar-link"><i class="fa-solid fa-clipboard-list"></i> Track Order</a><span style="opacity:0.4;">|</span><span class="top-bar-link"><i class="fa-solid fa-globe"></i> USD ($)</span></div>
    </div>
  </div>

  <header class="header-sticky">
    <div class="container header-inner">
      <a href="index.html" class="logo-wrap"><img src="assets/amezashopify logo.png" alt="AMEZA" onerror="this.style.display='none'"></a>
      <div class="header-actions">
        <a href="account.html" class="action-btn" title="My Account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        <button class="action-btn hamburger-btn" data-action="mobile-menu-toggle" aria-label="Open Navigation Menu" title="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content" id="order-detail-main">
          <!-- Populated by JS -->
        </main>
      </div>
    </div>
  </div>

  <footer class="footer-main" style="padding: 24px 0;"><div class="container"><div class="footer-bottom" style="border-top:none;padding-top:0;"><p>&copy; 2026 AMEZA. All rights reserved.</p><p class="footer-powered">Powered by <a href="https://techsyentra.com" target="_blank">techsyentra.com</a></p></div></div></footer>
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Currency Engine -->
  <script src="js/currency.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account-ui.js"></script>
  <script>
    const Auth = window.AmezaAuth;
    const UI = window.AccountUI;
    const user = UI.requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('account-sidebar').innerHTML = UI.sidebarHTML(user, 'orders');
    UI.initMobileSidebar();
    document.getElementById('sidebar-logout-btn').addEventListener('click', async () => {
      if (await UI.confirm({ title: 'Sign Out', description: 'Sign out?', confirmText: 'Sign Out', cancelText: 'Stay' })) {
        Auth.logout(); window.location.href = 'index.html';
      }
    });

    const orderId = new URLSearchParams(window.location.search).get('id');
    const main = document.getElementById('order-detail-main');

    if (!orderId) {
      main.innerHTML = `<div class="account-empty-state"><h3>No order specified</h3><p><a href="account-orders.html" class="btn-section-action" style="text-decoration:none;">Back to Orders</a></p></div>`;
    } else {
      const order = Auth.getOrderById(user.id, orderId);
      if (!order) {
        main.innerHTML = `<div class="account-card"><div class="account-card-body account-empty-state"><h3>Order not found</h3><p>This order doesn't exist or doesn't belong to your account.</p><a href="account-orders.html" class="btn-section-action" style="text-decoration:none; display:inline-flex;">← Back to Orders</a></div></div>`;
      } else {
        const items = Array.isArray(order.items) ? order.items : [];
        const subtotal = order.subtotal || order.total || 0;
        const shipping = order.shipping || 0;
        const total    = order.total || subtotal + shipping;

        main.innerHTML = `
          <!-- Breadcrumb -->
          <div style="margin-bottom: 20px; font-size: 0.85rem; color: var(--text-muted);">
            <a href="account.html" style="color: var(--text-muted); text-decoration:none;">Account</a>
            <span style="margin: 0 6px;">›</span>
            <a href="account-orders.html" style="color: var(--text-muted); text-decoration:none;">Orders</a>
            <span style="margin: 0 6px;">›</span>
            <span style="color: var(--dark); font-weight: 700;">#${order.id}</span>
          </div>

          <!-- Order Header -->
          <div class="account-card">
            <div class="account-card-body">
              <div class="order-detail-header">
                <div>
                  <h1 style="font-size: 1.3rem; font-weight: 800; color: var(--dark); margin-bottom: 4px;">Order #${order.id}</h1>
                  <p style="font-size: 0.85rem; color: var(--text-muted);">Placed on ${UI.formatDate(order.createdAt || order.date)}</p>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                  ${UI.statusBadge(order.status || 'Processing')}
                  <a href="account-orders.html" class="btn-section-action secondary" style="font-size: 0.8rem; padding: 6px 14px; text-decoration:none;">← Back to Orders</a>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: var(--bg-page); border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border);">
                <div>
                  <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Payment</div>
                  <div style="font-weight: 700; color: var(--dark);">${order.paymentMethod || 'Credit Card'}</div>
                  <div style="font-size: 0.8rem; color: var(--success);">${order.paymentStatus || 'Paid'}</div>
                </div>
                <div>
                  <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Shipping Address</div>
                  <div style="font-size: 0.85rem; color: var(--dark); line-height: 1.5;">${order.shippingAddress || '—'}</div>
                </div>
                <div>
                  <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Tracking Number</div>
                  <div style="font-weight: 700; color: var(--dark);">${order.trackingNumber || 'Not yet assigned'}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Order Items -->
          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path></svg> Order Items</div>
            </div>
            <div class="account-card-body" style="padding-bottom: 8px;">
              ${items.length === 0 ? '<p style="color: var(--text-muted);">No items in this order.</p>' :
                items.map(item => `
                  <div class="order-detail-product-row">
                    <img class="order-detail-img" src="${item.image || item.img || ''}" alt="${item.name || 'Product'}" onerror="this.style.background='var(--bg-page)'; this.src=''">
                    <div style="flex:1;">
                      <div style="font-weight: 700; color: var(--dark); font-size: 0.9rem; margin-bottom: 3px;">${item.name || 'Product'}</div>
                      ${item.size ? `<div style="font-size: 0.78rem; color: var(--text-muted);">Size: ${item.size}</div>` : ''}
                      ${item.color ? `<div style="font-size: 0.78rem; color: var(--text-muted);">Color: ${item.color}</div>` : ''}
                      <div style="font-size: 0.8rem; color: var(--text-muted);">Qty: ${item.quantity || item.qty || 1}</div>
                    </div>
                    <div style="font-weight: 800; color: var(--dark);">${UI.formatPrice((item.price || 0) * (item.quantity || item.qty || 1))}</div>
                  </div>
                `).join('')
              }

              <!-- Totals -->
              <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                <div class="order-totals-row"><span>Subtotal</span><span>${UI.formatPrice(subtotal)}</span></div>
                <div class="order-totals-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color: var(--success); font-weight: 700;">FREE</span>' : UI.formatPrice(shipping)}</span></div>
                ${order.discount ? `<div class="order-totals-row" style="color: var(--success);"><span>Discount</span><span>-${UI.formatPrice(order.discount || 0)}</span></div>` : ''}
                <div class="order-totals-row grand-total"><span>Total</span><span style="color: var(--primary-dark);">${UI.formatPrice(total)}</span></div>
              </div>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
