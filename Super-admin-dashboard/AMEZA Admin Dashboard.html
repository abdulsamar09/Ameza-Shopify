<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Admin | AMEZA</title>
<style>
:root{--g:#7ab32e;--gd:#5f8f1f;--nav:#111827;--bar:#1a1a1a;--bg:#f5f6f8;--c:#fff;--t:#111827;--m:#6b7280;--b:#e5e7eb;--r:#dc2626;--a:#d97706;--bl:#3b82f6;--soft:#f0f7e6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--c:#151c2e;--t:#e5e7eb;--m:#9ca3af;--b:#263044;--soft:#1d2a14}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:fixed;inset:0 0 auto 0;height:60px;background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:30;padding-top:env(safe-area-inset-top)}
.side{position:fixed;top:60px;bottom:0;left:0;width:248px;background:var(--nav);color:#cbd5e1;overflow:auto;padding:12px 10px;z-index:25;transition:transform .2s}
.side a{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;color:inherit;text-decoration:none;position:relative;margin-bottom:2px}
.side a:hover{background:#1f2937}.side a.on{background:#1f2937;color:#fff}.side a.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;background:var(--g);border-radius:0 4px 4px 0}
.side .bd{margin-left:auto;background:#374151;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}.side .bd.w{background:#b45309}
.side h6{margin:14px 12px 6px;font-size:11px;letter-spacing:.1em;color:#6b7280}
main{margin:60px 0 0 248px;padding:24px 28px 90px;min-width:0}
.logo{font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:8px}.logo i{width:30px;height:30px;border-radius:8px;background:var(--g);display:inline-block}
.search{flex:1;max-width:460px;margin-left:auto;background:#262626;border:1px solid #3a3a3a;border-radius:8px;height:38px;padding:0 12px;color:#fff;font-size:16px}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;min-width:44px;height:44px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}.k5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}
h1{font-size:24px;margin:0}.sub{color:var(--m);margin:2px 0 16px}.head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--b);background:var(--c);cursor:pointer}.btn:hover{border-color:var(--g)}.btn.p{background:#111;color:#fff;border-color:#111}.btn.g{background:var(--g);border-color:var(--g);color:#fff}.btn.d{color:var(--r)}.btn.s{min-height:30px;padding:0 10px;font-size:12px}
.fld,select,textarea,input[type=number],input[type=text],input[type=search]{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:8px 10px;min-height:38px}textarea{width:100%}
.kpi small{color:var(--m)}.kpi b{display:block;font-size:24px;margin:2px 0}.up{color:#15803d;font-weight:600;font-size:12px}.dn{color:var(--r);font-weight:600;font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--b);margin:-4px -4px 12px;padding:0 4px}.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--m);white-space:nowrap;min-height:44px;border-bottom:2px solid transparent}.tabs .on{color:var(--t);border-color:var(--g);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--m);text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--b)}td{padding:10px;border-bottom:1px solid var(--b);vertical-align:middle}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e5f6ea;color:#166534}.st.w{background:#fef3c7;color:#92400e}.st.r{background:#fee2e2;color:#991b1b}.st.n{background:#e5e7eb;color:#374151}
.ban{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}#modal.on{display:flex}#modal>form{background:var(--c);border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px}
#modal label{display:block;margin:10px 0;font-size:13px;color:var(--m)}#modal input,#modal select,#modal textarea{width:100%;display:block;margin-top:4px;font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;display:grid;gap:8px}#toast div{background:#111;color:#fff;padding:10px 16px;border-radius:8px}#toast .e{background:var(--r)}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:.2s;z-index:40}#top.on{opacity:1;pointer-events:auto}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--m)}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
pre{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:200px;margin:0}mark{background:#fde68a;color:#111}
.mx{overflow-x:auto}.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--c)}
.scrim{display:none}
@media(max-width:1100px){.k5{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:900px){.burger{display:block}.side{transform:translateX(-100%);width:min(280px,85vw)}.side.on{transform:none}.scrim.on{display:block;position:fixed;inset:60px 0 0;background:#0007;z-index:20}main{margin-left:0;padding:16px 16px 90px}.g2e{grid-template-columns:1fr}.search{max-width:none}}
@media(max-width:768px){.k5{grid-template-columns:1fr 1fr}thead{display:none}tr{display:block;border:1px solid var(--b);border-radius:10px;margin-bottom:10px;padding:6px}td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 8px;text-align:right}td:before{content:attr(data-l);color:var(--m);font-size:12px;text-align:left}.btn,.tabs button{min-height:44px}.btn.s{min-height:44px}#modal{align-items:flex-end;padding:0}#modal>form{width:100%;border-radius:16px 16px 0 0;max-height:94vh}.mx thead{display:table-header-group}.mx tr{display:table-row;border:0}.mx td{display:table-cell;text-align:left}.mx td:before{content:none}}
@media(max-width:420px){.k5{grid-template-columns:1fr}h1{font-size:20px}.top .logo span{display:none}}
</style></head><body data-access="admin">
<header class="top"><button class="burger" data-a="menu" aria-label="Menu">☰</button><div class="logo"><i></i><span>AMEZA Admin</span></div><input class="search" id="gs" type="search" placeholder="Search anything… (Ctrl K)" aria-label="Search"><span id="who" style="font-size:13px"></span></header>
<nav class="side" id="side" aria-label="Admin"></nav><div class="scrim" id="scrim" data-a="menu"></div>
<main id="app"></main><div id="toast"></div><div id="modal"></div><button id="top" aria-label="Back to top">↑</button>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=c=>(c/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
const D=864e5,ET=t=>new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',month:'2-digit',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true})+' ET';
const KEY='ameza_admin_v2',AREAS=['Sellers','Products','Orders','Finance','Content','Support','Settings','Audit'],OPS=['Read','Write','Approve','Delete'];
let DB,S={page:'Home',q:'',tab:'',range:30,cmp:true,exp:{},role:'Super admin'};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){const r=rng(7),now=Date.now(),pick=a=>a[Math.floor(r()*a.length)];
const sl=[['Ameza Official','Alexander Vance','TX',8,'Active'],['Portland Artisan Goods','Maya Brooks','OR',null,'Active'],['Austin Leather Co','Jake Turner','TX',12,'Active'],['Northstar Supply','Olivia Reed','MN',null,'Active'],['Urban Thread Co.','Ethan Cole','NY',9,'Active'],['Evergreen Home','Sophia Lane','WA',null,'Pending'],['Desert Watch Works','Liam Hayes','AZ',11,'Pending'],['Lakeside Audio','Emma Ross','IL',10,'Suspended'],['Bay Gadgets','Noah Kim','CA',10,'Rejected']];
const cats=[['Clothing',10],['Electronics',12],['Watches',11],['Bags and Totes',10],['Leather Goods',12],['Accessories',9],['Home & Living',10],['Beauty and Health',10]].map(c=>({name:c[0],rate:c[1],on:true}));
const sellers=sl.map((s,i)=>({id:i,name:s[0],owner:s[1],state:s[2],rate:s[3],status:s[4],trusted:i<2,frozen:false}));
const fn=['Ava','Noah','Mia','Liam','Zoe','Ethan','Ella','Mason','Lily','Jack','Nora','Leo'],ln=['Smith','Johnson','Brown','Davis','Miller','Wilson','Moore','Taylor','Clark','Lewis','Young','Hall'];
const customers=fn.map((f,i)=>({id:i,name:f+' '+ln[i],email:(f+'.'+ln[i]).toLowerCase()+'@example.com',t:now-Math.floor(r()*80)*D,status:'Active'}));
const prods=['Classic Leather Tote','Minimalist Chronograph','Wireless Earbuds','Linen Shirt','Bi-fold Wallet','Smartwatch S2','Bluetooth Speaker','Canvas Belt','Cotton Hoodie','Ceramic Mug Set','Crossbody Bag','Aviator Sunglasses'];
const products=prods.map((n,i)=>({id:i,name:n,seller:i%5,cat:[3,2,1,0,4,1,1,5,0,6,3,5][i],price:1999+Math.floor(r()*18000),rate:i===1?7:null,status:i<3?'Pending review':i===11?'Rejected':'Published',featured:i===5,reason:i===11?'Prohibited item: restricted eyewear claims':''}));
const orders=[];for(let i=0;i<150;i++){const p=pick(products),s=sellers[p.seller],age=r()*60,st=age<3?pick(['Processing','Shipped']):pick(['Delivered','Delivered','Delivered','Cancelled','Shipped']);const amt=p.price*(1+Math.floor(r()*3));
orders.push({id:'ORD-'+(10001+i),t:now-age*D,cust:pick(customers).name,seller:s.id,prod:p.id,cat:p.cat,amount:amt,status:st,pay:st==='Cancelled'?'Voided':'Paid',refunded:0});}
orders.sort((a,b)=>b.t-a.t);
const db={sellers,products,orders,customers,cats,globalRate:10,audit:[],payouts:[],tickets:[],staff:[],roles:{},settings:{name:'AMEZA Marketplace',cod:false,reviews:true,messaging:true,autoApprove:false,blockContact:true}};
db.orders.forEach(o=>{o.fee=Math.round(o.amount*rate(db,o.seller,o.cat,o.prod).v/100)});
for(let i=0;i<5;i++){const a=avail(db,i);db.payouts.push({id:'PO-'+(2001+i),seller:i,amount:Math.max(5000,Math.round(a*(i===3?1.5:.55)/100)*100),status:i<3?'Requested':i===3?'Requested':'Paid',method:i%2?'PayPal':'Bank (ACH) ****4821',ref:i===4?'ACH-77120':''})}
db.tickets=[['Item not as described','Ava Smith',2],['Package never arrived','Mia Brown',1],['Counterfeit claim','Noah Johnson',4],['Late shipping dispute','Ella Moore',3]].map((x,i)=>({id:'DSP-'+(301+i),title:x[0],buyer:x[1],seller:x[2],status:'Open',amount:3500+i*4100,t:now-i*D}));
const all=Object.fromEntries(AREAS.map(a=>[a,[1,1,1,1]])),none=()=>Object.fromEntries(AREAS.map(a=>[a,[0,0,0,0]]));
db.roles={'Super admin':all,'Finance manager':{...none(),Finance:[1,1,1,0],Orders:[1,0,0,0],Audit:[1,0,0,0]},'Support agent':{...none(),Support:[1,1,1,0],Orders:[1,0,0,0],Sellers:[1,0,0,0]},'Content editor':{...none(),Content:[1,1,0,0],Products:[1,0,0,0]}};
db.staff=[['Alexander Vance','Super admin'],['Priya Nair','Finance manager'],['Chris Walker','Support agent'],['Dana Price','Content editor']].map((x,i)=>({id:i,name:x[0],email:x[0].toLowerCase().replace(' ','.')+'@example.com',role:x[1]}));
return db}
function rate(db,sid,cat,pid){const p=db.products[pid],s=db.sellers[sid],c=db.cats[cat];const chain=[['Product',p&&p.rate],['Seller',s&&s.rate],['Category',c&&c.rate],['Global',db.globalRate]];const m=chain.find(x=>x[1]!=null);return{v:m[1],src:m[0],chain}}
function net(o){return o.amount-o.fee-o.refunded+Math.round(o.fee*o.refunded/o.amount)}
function avail(db,sid){return db.orders.filter(o=>o.seller===sid&&o.status==='Delivered').reduce((a,o)=>a+net(o),0)-(db.payouts||[]).filter(p=>p.seller===sid&&p.status==='Paid').reduce((a,p)=>a+p.amount,0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!DB||!DB.orders)DB=seed();
const can=(a,op=0)=>!a||(DB.roles[S.role]?.[a]?.[op]);
function aud(action,type,name,before,after){DB.audit.unshift({t:Date.now(),actor:DB.staff.find(s=>s.role===S.role)?.email||'alexander.vance@example.com',role:S.role,action,type,name,before:before||{},after:after||{},ip:'203.0.113.'+(10+DB.audit.length%40)});save()}
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
function modal(title,body,ok,label='Save'){const m=$('#modal');m.innerHTML=`<form role="dialog" aria-label="${esc(title)}"><h2 style="margin:0 0 8px">${esc(title)}</h2>${body}<div class="acts" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">${esc(label)}</button></div></form>`;m.classList.add('on');m._ok=ok;(m.querySelector('input,select,textarea')||{focus(){}}).focus()}
const close=()=>{$('#modal').classList.remove('on')};
const ask=(title,lab,cb)=>modal(title,`<label>${lab}<textarea name="note" required rows="3"></textarea></label>`,f=>cb(f.get('note').trim()));
const stc=s=>/Pending|Requested|Processing|Open|Approved/.test(s)?'w':/Reject|Suspend|Blocked|Cancel|Refund|Voided/.test(s)?'r':/Shipped|Frozen/.test(s)?'n':'';
const st=s=>`<span class="st ${stc(s)}">${esc(s)}</span>`;
const B=(a,id,l,c='')=>`<button class="btn s ${c}" data-a="${a}" data-id="${id}">${l}</button>`;
function tbl(cols,rows){if(!rows.length)return'<p class="sub" style="padding:20px;text-align:center">No matching results. Try changing your search or filter.</p>';return`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-l="${c[0]}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const tabsH=(l,counts)=>`<div class="tabs" role="tablist">${l.map(t=>`<button class="${(S.tab||l[0])===t?'on':''}" data-a="tab" data-id="${esc(t)}">${t}${counts?` (${counts(t)})`:''}</button>`).join('')}</div>`;
const tb=(ph='Search…')=>`<div class="acts" style="margin-bottom:12px"><input type="search" class="fld" style="flex:1;min-width:180px;font-size:16px" data-i="q" value="${esc(S.q)}" placeholder="${ph}" aria-label="Search"><button class="btn" data-a="csv">↓ Export CSV</button></div>`;
const hd=(t,s,a='')=>`<div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="acts">${a}</div></div>`;
const q=x=>!S.q||JSON.stringify(x).toLowerCase().includes(S.q.toLowerCase());
const sellerName=i=>esc(DB.sellers[i]?.name);
/* ---------- pages ---------- */
function series(days,off,f){const e=Date.now()-off*D,out=Array(days).fill(0);DB.orders.forEach(o=>{if(o.status==='Cancelled')return;const k=Math.floor((e-o.t)/D);if(k>=0&&k<days)out[days-1-k]+=f(o)});return out}
const sum=a=>a.reduce((x,y)=>x+y,0);
function dl(c,p,money){if(!p)return`<span class="up" style="color:var(--m)">— no prior data</span>`;const d=(c-p)/p*100;return`<span class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span> <small>vs previous ${S.range} days</small>`}
function spark(a,c='#7ab32e'){const m=Math.max(...a,1);return`<svg viewBox="0 0 80 28" width="80" height="28" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${a.map((v,i)=>`${i/(a.length-1)*80},${26-v/m*24}`).join(' ')}"/></svg>`}
function Home(){const n=S.range,gc=series(n,0,o=>o.amount),gp=series(n,n,o=>o.amount),cc=series(n,0,o=>o.fee),cp=series(n,n,o=>o.fee),oc=series(n,0,o=>1),op=series(n,n,o=>1);
const now=Date.now(),nc=DB.customers.filter(c=>c.t>now-n*D).length,np=DB.customers.filter(c=>c.t<=now-n*D&&c.t>now-2*n*D).length;
const pend=DB.sellers.filter(s=>s.status==='Pending').length,pp=DB.products.filter(p=>p.status==='Pending review').length,po=DB.payouts.filter(p=>p.status==='Requested'),disp=DB.tickets.filter(t=>t.status==='Open').length;
const K=[['GMV',fm(sum(gc)),sum(gc),sum(gp),gc],['Platform commission',fm(sum(cc)),sum(cc),sum(cp),cc],['Orders',sum(oc),sum(oc),sum(op),oc],['New customers',nc,nc,np,null]].map(k=>`<div class="card kpi"><small>${k[0]}</small><b>${k[1]}</b><div>${S.cmp?dl(k[2],k[3]):''}</div>${k[4]?spark(k[4]):''}</div>`).join('')+`<div class="card kpi"><small>Seller applications</small><b>${pend}</b><small>${pp} products awaiting review</small></div>`;
const W=720,H=250,P=48,mx=Math.max(...gc,...(S.cmp?gp:[0]),1)*1.1,X=i=>P+i/(n-1)*(W-P-10),Y=v=>H-24-v/mx*(H-40),pl=(a,c,d='')=>`<polyline fill="none" stroke="${c}" stroke-width="2" ${d} points="${a.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
const lab=[0,.25,.5,.75,1].map(f=>`<text x="2" y="${Y(mx*f/1.1)+4}" font-size="11" fill="currentColor" opacity=".6">${fm(mx*f/1.1)}</text><line x1="${P}" x2="${W}" y1="${Y(mx*f/1.1)}" y2="${Y(mx*f/1.1)}" stroke="currentColor" opacity=".1"/>`).join('');
const xl=[0,Math.floor(n/3),Math.floor(2*n/3),n-1].map(i=>`<text x="${X(i)}" y="${H-4}" font-size="11" fill="currentColor" opacity=".6" text-anchor="middle">${new Date(now-(n-1-i)*D).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'})}</text>`).join('');
const top=DB.sellers.map(s=>({s,v:sum(DB.orders.filter(o=>o.seller===s.id&&o.status!=='Cancelled').map(o=>o.amount))})).sort((a,b)=>b.v-a.v).slice(0,5);
const tc=DB.cats.map((c,i)=>({c,v:sum(DB.orders.filter(o=>o.cat===i&&o.status!=='Cancelled').map(o=>o.amount))})).sort((a,b)=>b.v-a.v).slice(0,4);
return hd('Overview','What is happening in your marketplace.',`<select aria-label="Date range" data-i="range">${[7,30,90].map(x=>`<option value="${x}" ${x===n?'selected':''}>Last ${x} days</option>`).join('')}</select><label class="acts"><input type="checkbox" data-i="cmp" ${S.cmp?'checked':''}> Compare</label><button class="btn" data-a="exphome">Export</button>`)+

poa(id){const p=DB.payouts.find(x=>x.id===id);if(p.amount>avail(DB,p.seller))return toast('Blocked: exceeds available balance',1);if(DB.sellers[p.seller].frozen)return toast('Seller payouts are frozen',1);const b={status:p.status};p.status='Approved';aud('Approved payout','payouts',p.id,b,{status:p.status});render();toast('Payout approved')},
por(id){ask('Reject payout','Reason (required)',n=>{const p=DB.payouts.find(x=>x.id===id);p.status='Rejected';p.ref=n;aud('Rejected payout','payouts',id,{status:'Requested'},{status:'Rejected',reason:n});render()})},
pop(id){modal('Mark paid',`<label>Bank reference number<input name="r" required></label>`,f=>{const p=DB.payouts.find(x=>x.id===id);p.status='Paid';p.ref=f.get('r');aud('Marked payout paid','payouts',id,{status:'Approved'},{status:'Paid',ref:p.ref});render();toast('Marked paid; seller notified')})},
ce(i){const c=DB.cats[i];modal('Edit '+c.name,`<label>Commission % (0–50)<input type="number" name="r" min="0" max="50" step="0.5" value="${c.rate}" required></label>`,f=>{const v=+f.get('r');if(!(v>=0&&v<=50))return toast('Rate must be 0–50',1),false;const b={rate:c.rate};c.rate=v;aud('Updated category rate','categories',c.name,b,{rate:v});render()})},
ct(i){const c=DB.cats[i],b={on:c.on};c.on=!c.on;aud('Toggled category','categories',c.name,b,{on:c.on});render()},cadd(){modal('Add category',`<label>Name<input name="n" required></label><label>Commission %<input type="number" name="r" min="0" max="50" value="10"></label>`,f=>{const n=f.get('n').trim();if(DB.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return toast('Category already exists',1),false;DB.cats.push({name:n,rate:+f.get('r'),on:true});aud('Created category','categories',n,{},{rate:+f.get('r')});render()})},
dr(id){rule(id,'Ruled for buyer')},dr2(id){rule(id,'Ruled for seller')},ds(id){rule(id,'Split refund')},
exp(_,id){S.exp[id]=!S.exp[id];render()},sn(){const b={name:DB.settings.name};DB.settings.name=$('#sn').value.trim()||b.name;aud('Updated settings','settings','Site name',b,{name:DB.settings.name});toast('Saved')},reset(){modal('Reset demo data',`<p class="sub">This clears all changes and the audit log.</p>`,()=>{localStorage.removeItem(KEY);DB=seed();render();toast('Demo data reset')},'Reset')}};
function rule(id,l){ask(l,'Note (required)',n=>{const t=DB.tickets.find(x=>x.id===id),b={status:t.status};t.status=l;t.note=n;aud(l,'support',id,b,{status:l,note:n});render();toast(l)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a;if(a==='nav'){return}if(A[a]){e.preventDefault();A[a](b.dataset.id?(isNaN(b.dataset.id)||['tab','exp'].includes(a)?b.dataset.id:+b.dataset.id):undefined,b.dataset.id)}});
$('#modal').addEventListener('submit',e=>{e.preventDefault();const m=$('#modal'),f=new FormData(e.target);if(m._ok(f)!==false)close()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gs').focus()}});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(!i)return;if(i==='q'){S.q=t.value;S.pg=0;const p=t.selectionStart;render();const n=$('[data-i=q]');if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(!i||i==='q')return;const id=+t.dataset.id;
if(i==='range'){S.range=+t.value;render()}else if(i==='cmp'){S.cmp=t.checked;render()}else if(i==='rs'){S.rs=S.rs||{s:0,c:0,p:''};S.rs[t.dataset.k]=t.value;render()}
else if(i==='cr'){const v=+t.value;if(!(v>=0&&v<=50)){toast('Rate must be 0–50',1);return render()}const b=DB.cats[id].rate;DB.cats[id].rate=v;aud('Updated category rate','categories',DB.cats[id].name,{rate:b},{rate:v});toast('Saved')}
else if(i==='ca'){A.ct(id)}else if(i==='role'){S.role=t.value;render()}else if(i==='mr'){S.mr=t.value;render()}
else if(i==='srole'){const s=DB.staff[id],b={role:s.role};s.role=t.value;aud('Changed role','staff',s.name,b,{role:s.role});toast('Role updated')}
else if(i==='perm'){const r=S.mr||Object.keys(DB.roles)[0],a=t.dataset.a2,b=[...DB.roles[r][a]];DB.roles[r][a][id]=t.checked?1:0;if(t.checked&&(a==='Finance'||a==='Settings'))toast('Warning: you granted '+OPS[id]+' on '+a,1);aud('Changed permissions','roles',r+' / '+a,{perm:b},{perm:DB.roles[r][a]});render()}
else if(i==='set'){const k=t.dataset.id,b=DB.settings[k];DB.settings[k]=t.checked;aud('Updated setting','settings',k,{v:b},{v:t.checked});toast('Saved')}});
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value){const v=e.target.value.toLowerCase(),m=['Sellers','Products','Orders','Customers'].find(p=>p.toLowerCase().startsWith(v));if(m){go(m)}else{S.page='Orders';S.q=e.target.value;render()}e.target.value=''}});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
addEventListener('scroll',()=>$('#top').classList.toggle('on',scrollY>400),{passive:true});
$('#top').onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
go(location.hash.slice(1)||'Home');
</script></body></html>
