<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addresses | AMEZA Account</title>
  <meta name="description" content="Manage your shipping addresses.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="icon" type="image/png" href="assets/amezashopify logo.png">
</head>
<body>

  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-left"><span class="top-bar-badge"><i class="fa-solid fa-tag"></i> Special Offer</span><span>Free Worldwide Express Shipping on all orders over $100</span></div>
      <div class="top-bar-right"><a href="account-orders.html" class="top-bar-link"><i class="fa-solid fa-clipboard-list"></i> Track Order</a><span style="opacity:0.4;">|</span><span class="top-bar-link"><i class="fa-solid fa-globe"></i> USD ($)</span></div>
    </div>
  </div>

  <header class="header-sticky">
    <div class="container header-inner">
      <a href="index.html" class="logo-wrap"><img src="assets/amezashopify logo.png" alt="AMEZA" onerror="this.style.display='none'"></a>
      <div class="header-actions">
        <a href="account.html" class="action-btn" title="My Account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        <a href="wishlist.html" class="action-btn" title="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
        <button class="action-btn hamburger-btn" data-action="mobile-menu-toggle" aria-label="Toggle Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content">

          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Saved Addresses
              </div>
              <button class="btn-section-action" id="btn-add-address" aria-label="Add new address">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Address
              </button>
            </div>
            <div class="account-card-body">

              <!-- Address form (hidden) -->
              <div id="address-form-container" style="display: none; margin-bottom: 24px;">
                <div style="background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;">
                  <h3 style="font-size: 0.95rem; font-weight: 800; color: var(--dark); margin-bottom: 16px;" id="address-form-title">Add New Address</h3>
                  <div id="address-form-fields"></div>
                  <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button class="btn-section-action" id="btn-save-address" aria-label="Save address">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg>
                      <span id="btn-save-addr-label">Save Address</span>
                    </button>
                    <button class="btn-section-action secondary" id="btn-cancel-address">Cancel</button>
                  </div>
                </div>
              </div>

              <!-- Addresses grid -->
              <div class="addresses-grid" id="addresses-grid">
                <!-- Populated by JS -->
              </div>

            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <footer class="footer-main" style="padding: 24px 0;"><div class="container"><div class="footer-bottom" style="border-top:none;padding-top:0;"><p>&copy; 2026 AMEZA. All rights reserved.</p><p class="footer-powered">Powered by <a href="https://techsyentra.com" target="_blank">techsyentra.com</a></p></div></div></footer>
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Currency Engine -->
  <script src="js/currency.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account-ui.js"></script>
  <script>
    const Auth = window.AmezaAuth;
    const UI = window.AccountUI;
    const user = UI.requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('account-sidebar').innerHTML = UI.sidebarHTML(user, 'addresses');
    UI.initMobileSidebar();
    document.getElementById('sidebar-logout-btn').addEventListener('click', async () => {
      if (await UI.confirm({ title: 'Sign Out', description: 'Sign out?', confirmText: 'Sign Out', cancelText: 'Stay' })) {
        Auth.logout(); window.location.href = 'index.html';
      }
    });

    let editingAddressId = null;

    // ─── Render addresses ──────────────────────────────────────────
    function renderAddresses() {
      const addresses = Auth.getAddresses(user.id);
      const grid = document.getElementById('addresses-grid');

      if (addresses.length === 0) {
        grid.innerHTML = `
          <div class="account-empty-state" style="grid-column: 1/-1;">
            <div class="account-empty-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </div>
            <h3>No addresses saved</h3>
            <p>Add a shipping address to speed up your checkout.</p>
            <button class="btn-section-action" onclick="showAddForm()">Add Your First Address</button>
          </div>`;
        return;
      }

      grid.innerHTML = addresses.map(addr => `
        <div class="address-card ${addr.isDefault ? 'is-default' : ''}" id="addr-card-${addr.id}">
          ${addr.isDefault ? '<div class="address-default-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Default</div>' : ''}
          <div class="address-name">${addr.firstName} ${addr.lastName}${addr.company ? ` — ${addr.company}` : ''}</div>
          <div class="address-lines">
            ${addr.line1}<br>
            ${addr.line2 ? addr.line2 + '<br>' : ''}
            ${addr.city}${addr.state ? ', ' + addr.state : ''} ${addr.zip}<br>
            ${addr.country}<br>
            ${addr.phone ? '📞 ' + addr.phone : ''}
          </div>
          <div class="address-actions">
            <button class="btn-addr-action" onclick="editAddress('${addr.id}')" aria-label="Edit address">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              Edit
            </button>
            ${!addr.isDefault ? `
              <button class="btn-addr-action" onclick="setDefault('${addr.id}')" aria-label="Set as default address">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Set Default
              </button>` : ''}
            <button class="btn-addr-action danger" onclick="deleteAddr('${addr.id}', ${addr.isDefault})" aria-label="Delete address">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
              Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    // ─── Add form ─────────────────────────────────────────────────
    function showAddForm(addr = {}) {
      editingAddressId = addr.id || null;
      document.getElementById('address-form-container').style.display = 'block';
      document.getElementById('address-form-title').textContent = editingAddressId ? 'Edit Address' : 'Add New Address';
      document.getElementById('btn-save-addr-label').textContent = editingAddressId ? 'Update Address' : 'Save Address';
      document.getElementById('address-form-fields').innerHTML = UI.addressFormHTML(addr);
      document.getElementById('address-form-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideForm() {
      editingAddressId = null;
      document.getElementById('address-form-container').style.display = 'none';
    }

    window.editAddress = (id) => {
      const addresses = Auth.getAddresses(user.id);
      const addr = addresses.find(a => a.id === id);
      if (addr) showAddForm(addr);
    };

    window.setDefault = (id) => {
      Auth.setDefaultAddress(user.id, id);
      renderAddresses();
      UI.toast('Default address updated.', 'success');
    };

    window.deleteAddr = async (id, isDefault) => {
      const addresses = Auth.getAddresses(user.id);
      const msg = isDefault && addresses.length > 1
        ? 'This is your default address. Deleting it will set the next address as default. Are you sure?'
        : 'Are you sure you want to delete this address?';

      const confirmed = await UI.confirm({ title: 'Delete Address', description: msg, confirmText: 'Delete', dangerous: true });
      if (confirmed) {
        const result = Auth.deleteAddress(user.id, id);
        if (result.success) {
          renderAddresses();
          UI.toast('Address deleted.', 'success');
        } else {
          UI.toast(result.error || 'Failed to delete address.', 'error');
        }
      }
    };

    document.getElementById('btn-add-address').addEventListener('click', () => showAddForm());
    document.getElementById('btn-cancel-address').addEventListener('click', hideForm);

    document.getElementById('btn-save-address').addEventListener('click', () => {
      const data = UI.readAddressForm();
      if (!data.firstName || !data.lastName || !data.line1 || !data.city || !data.zip || !data.country) {
        UI.toast('Please fill in all required fields.', 'error');
        return;
      }
      if (editingAddressId) {
        const result = Auth.updateAddress(user.id, editingAddressId, data);
        if (result.success) { UI.toast('Address updated.', 'success'); }
        else { UI.toast(result.error || 'Update failed.', 'error'); return; }
      } else {
        Auth.addAddress(user.id, data);
        UI.toast('Address added.', 'success');
      }
      hideForm();
      renderAddresses();
    });

    renderAddresses();
  </script>
</body>
</html>
