<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Catalog &mdash; AMEZA Marketplace</title>
  <meta name="description" content="Explore products by tag on AMEZA Marketplace. Shop handcrafted, sustainable, and premium artisan items across the United States.">

  <!-- Google Fonts: Inter, Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core, Home Style & Taxonomy Styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart-drawer.css">
  <link rel="stylesheet" href="css/taxonomy.css">
  <link rel="icon" type="image/png" href="assets/ameza-logo.png">
</head>
<body data-layout="storefront">
  <div id="site-header"></div>

  <!-- Dedicated Tag Catalog Root -->
  <main id="taxonomy-app-root">
    <!-- Populated dynamically by taxonomy-page.js -->
  </main>

  <div id="site-footer"></div>

  <!-- Currency Engine -->
  <script src="js/currency.js"></script>

  <!-- Taxonomy Page Module -->
  <script type="module">
    import { initTaxonomyPage } from './js/taxonomy-page.js';

    document.addEventListener('DOMContentLoaded', () => {
      initTaxonomyPage('tag');
    });
  </script>

  <!-- Unified Layout Module -->
  <script type="module" src="js/core/layout.js"></script>
</body>
</html>
