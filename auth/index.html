<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AMEZA Premium E-Commerce Store</title>
  <meta name="description" content="Sign in to your AMEZA account to access your orders, wishlist, and personalized shopping experience.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/buyer/css/account.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/base.css">
</head>
<body class="auth" data-layout="focus" data-access="public" data-area="auth">
  <div id="site-header"></div>

  <!-- TOP ANNOUNCEMENT BAR -->
  

  <!-- MAIN HEADER -->
  

  <!-- LOGIN PAGE CONTENT -->
  <main>
    <div class="auth-page-wrapper">
      <div class="auth-card">

        <!-- Logo -->
        <a href="/" class="auth-logo-link">
          <img src="/assets/ameza-logo.png" alt="AMEZA" onerror="this.style.display='none'">
        </a>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to continue shopping.</p>

        <!-- Form-level alert -->
        <div class="auth-alert alert-error" id="login-alert" role="alert" aria-live="polite">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span id="login-alert-msg"></span>
        </div>

        <!-- 2FA challenge (hidden by default) -->
        <div id="twofa-challenge" style="display: none;">
          <div class="auth-alert alert-info show" style="margin-bottom: 16px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            <span>Two-factor authentication is enabled on this account. Enter the 6-digit code from your authenticator app.</span>
          </div>

          <div class="auth-form-group">
            <label for="twofa-code">Authentication Code</label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              <input type="text" id="twofa-code" class="auth-input" placeholder="000000" maxlength="10" autocomplete="one-time-code" inputmode="numeric" aria-label="Two-factor authentication code">
            </div>
          </div>
          <p style="font-size:0.8rem; color: var(--text-muted); margin-bottom: 16px;">
            Can't access your authenticator? 
            <a href="#" class="auth-link" id="use-recovery-code-link">Use a recovery code</a>
          </p>
          <button class="btn-auth-primary" id="btn-verify-2fa" type="button" aria-label="Verify two-factor code">
            <span class="btn-spinner" id="spinner-2fa"></span>
            <span id="btn-2fa-label">Verify Code</span>
          </button>
          <button class="btn-auth-primary" id="btn-back-to-login" type="button" style="background: var(--bg-page); color: var(--text-main); box-shadow: none; border: 1px solid var(--border);" aria-label="Back to login form">
            ← Back
          </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" novalidate>
          <!-- Email -->
          <div class="auth-form-group">
            <label for="login-email">Email Address <span class="required" aria-hidden="true">*</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input type="email" id="login-email" class="auth-input" placeholder="you@example.com" autocomplete="email" required aria-describedby="login-email-error">
            </div>
            <div class="auth-error-msg" id="login-email-error" role="alert">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
              <span id="login-email-error-text"></span>
            </div>
          </div>

          <!-- Password -->
          <div class="auth-form-group">
            <label for="login-password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="login-password" class="auth-input" placeholder="Your password" autocomplete="current-password" required aria-describedby="login-password-error">
              <button type="button" class="btn-password-toggle" id="toggle-login-password" aria-label="Toggle password visibility">
                <svg id="eye-icon-login" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="auth-error-msg" id="login-password-error" role="alert">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
              <span id="login-password-error-text"></span>
            </div>
          </div>

          <!-- Options -->
          <div class="auth-options-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="remember-me" checked aria-label="Remember me">
              Remember me
            </label>
            <a href="/auth/forgot-password.html" class="auth-link">Forgot Password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-auth-primary" id="btn-login" aria-label="Sign in to your account">
            <span class="btn-spinner" id="spinner-login"></span>
            <span id="btn-login-label">Sign In</span>
          </button>
        </form>

        <!-- Switch to signup -->
        <div class="auth-switch-row">
          Don't have an account? <a href="/auth/signup.html">Create Account</a>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER (simplified) -->
  <div id="site-footer"></div>

  <!-- Toast Container -->
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Unified Module Bootstrap -->
  <script type="module" src="/auth/js/pages/login.js"></script>
</body>
</html>
