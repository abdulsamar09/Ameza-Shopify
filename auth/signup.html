<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | AMEZA Premium E-Commerce Store</title>
  <meta name="description" content="Create your AMEZA account for faster checkout, order tracking, wishlist management and exclusive member benefits.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/buyer/css/account.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/base.css">
</head>
<body class="auth" data-layout="focus" data-access="public" data-area="auth">
  <div id="site-header"></div>

  <!-- TOP BAR -->
  

  <!-- MAIN HEADER -->
  

  <!-- SIGNUP CONTENT -->
  <main>
    <div class="auth-page-wrapper">
      <div class="auth-card auth-card-wide">

        <a href="/" class="auth-logo-link">
          <img src="/assets/ameza-logo.png" alt="AMEZA" onerror="this.style.display='none'">
        </a>

        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join us for a faster and better shopping experience.</p>

        <!-- Alert -->
        <div class="auth-alert" id="signup-alert" role="alert" aria-live="polite">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span id="signup-alert-msg"></span>
        </div>

        <form id="signup-form" novalidate>
          <!-- Name row -->
          <div class="auth-form-row">
            <div class="auth-form-group">
              <label for="signup-firstname">First Name <span class="required">*</span></label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input type="text" id="signup-firstname" class="auth-input" placeholder="John" autocomplete="given-name" required aria-describedby="err-firstname">
              </div>
              <div class="auth-error-msg" id="err-firstname" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-firstname-text"></span></div>
            </div>
            <div class="auth-form-group">
              <label for="signup-lastname">Last Name <span class="required">*</span></label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input type="text" id="signup-lastname" class="auth-input" placeholder="Doe" autocomplete="family-name" required aria-describedby="err-lastname">
              </div>
              <div class="auth-error-msg" id="err-lastname" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-lastname-text"></span></div>
            </div>
          </div>

          <!-- Email -->
          <div class="auth-form-group">
            <label for="signup-email">Email Address <span class="required">*</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input type="email" id="signup-email" class="auth-input" placeholder="you@example.com" autocomplete="email" required aria-describedby="err-email">
            </div>
            <div class="auth-error-msg" id="err-email" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-email-text"></span></div>
          </div>

          <!-- Phone (optional) -->
          <div class="auth-form-group">
            <label for="signup-phone">Phone Number <span style="font-size:0.78rem; color: var(--text-muted); font-weight:500;">(optional)</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1 19.79 19.79 0 0 1 1.6 4.58 2 2 0 0 1 3.56 2.4h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              <input type="tel" id="signup-phone" class="auth-input" placeholder="+1 (555) 000-0000" autocomplete="tel">
            </div>
          </div>

          <!-- Password -->
          <div class="auth-form-group">
            <label for="signup-password">Password <span class="required">*</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="signup-password" class="auth-input" placeholder="Create a strong password" autocomplete="new-password" required aria-describedby="err-password">
              <button type="button" class="btn-password-toggle" id="toggle-signup-password" aria-label="Toggle password visibility">
                <svg id="eye-icon-signup" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="auth-error-msg" id="err-password" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-password-text"></span></div>

            <!-- Strength bar -->
            <div class="password-strength-wrap">
              <div class="password-strength-bar-track">
                <div class="password-strength-bar-fill" id="strength-bar"></div>
              </div>
              <span class="password-strength-label" id="strength-label" style="color: var(--text-muted);"></span>
            </div>

            <!-- Requirements -->
            <div class="password-requirements">
              <div class="password-req-title">Password must include:</div>
              <ul class="password-req-list" aria-label="Password requirements">
                <li class="password-req-item" id="req-length">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  8+ characters
                </li>
                <li class="password-req-item" id="req-uppercase">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  Uppercase letter
                </li>
                <li class="password-req-item" id="req-lowercase">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  Lowercase letter
                </li>
                <li class="password-req-item" id="req-number">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  One number
                </li>
                <li class="password-req-item" id="req-special">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  Special character
                </li>
              </ul>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="auth-form-group">
            <label for="signup-confirm-password">Confirm Password <span class="required">*</span></label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="signup-confirm-password" class="auth-input" placeholder="Repeat your password" autocomplete="new-password" required aria-describedby="err-confirm">
              <button type="button" class="btn-password-toggle" id="toggle-confirm-password" aria-label="Toggle confirm password visibility">
                <svg id="eye-icon-confirm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="auth-error-msg" id="err-confirm" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-confirm-text"></span></div>
          </div>

          <!-- Terms -->
          <div class="auth-form-group">
            <label class="auth-checkbox-label" style="align-items: flex-start; gap: 10px;">
              <input type="checkbox" id="terms-checkbox" required aria-describedby="err-terms" style="margin-top: 2px; flex-shrink: 0;">
              <span style="font-size: 0.83rem; line-height: 1.5;">I agree to AMEZA's <a href="#" class="auth-link">Terms &amp; Conditions</a> and <a href="#" class="auth-link">Privacy Policy</a>.</span>
            </label>
            <div class="auth-error-msg" id="err-terms" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span id="err-terms-text"></span></div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-auth-primary" id="btn-signup" aria-label="Create your account">
            <span class="btn-spinner" id="spinner-signup"></span>
            <span id="btn-signup-label">Create Account</span>
          </button>
        </form>

        <div class="auth-switch-row">
          Already have an account? <a href="/auth/login.html">Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Unified Module Bootstrap -->
  <script type="module" src="/auth/js/pages/signup.js"></script>
</body>
</html>
