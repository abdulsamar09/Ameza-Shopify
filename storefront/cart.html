<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart &mdash; AMEZA Marketplace</title>
  <meta name="description" content="Review items in your AMEZA cart, customize special delivery notes, calculate free shipping, and checkout securely.">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/storefront/css/cart-drawer.css">
  <link rel="stylesheet" href="/storefront/css/cart.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
</head>
<body class="cart-page-body" data-layout="none" data-access="public" data-area="storefront">
  <!-- MAIN CART PAGE CONTENT -->
  <main class="cart-main-container" id="cart-page-content">
    <!-- Populated dynamically by cart-page.js -->
  </main>

  <!-- Scripts -->
  <script src="/shared/js/currency.js"></script>
  <script src="/auth/js/auth.js"></script>

  <!-- Script Module -->
  <script type="module">
    import { initCartPage } from './js/cart-page.js';
    import { initCartDrawer } from './js/cart-drawer.js';

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        initCartPage();
        initCartDrawer();
      });
    } else {
      initCartPage();
      initCartDrawer();
    }
  </script>

  <!-- Unified Layout Module -->
  <script type="module" src="/shared/js/core/layout.js"></script>
</body>
</html>
