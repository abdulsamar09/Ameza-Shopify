<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMEZA Mail Outbox &mdash; Dev Console</title>
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #F8FAFC; font-family: var(--font-body, 'Inter', sans-serif); padding: 24px; color: #0F172A; }
    .outbox-wrap { max-width: 1000px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; border: 1px solid #E2E8F0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .outbox-header { padding: 20px 24px; background: #0F172A; color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; }
    .outbox-header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .outbox-list { divide-y: 1px solid #E2E8F0; }
    .mail-item { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #F1F5F9; }
    .mail-item:hover { background: #F8FAFC; }
    .mail-to { font-weight: 600; font-size: 14px; color: #1E293B; }
    .mail-sub { font-size: 13px; color: #64748B; margin-top: 2px; }
    .mail-time { font-size: 12px; color: #94A3B8; }
    .outbox-empty { padding: 48px; text-align: center; color: #64748B; font-size: 14px; }
    .btn-clear { background: #334155; color: #FFFFFF; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn-clear:hover { background: #475569; }
  </style>
</head>
<body data-layout="none" data-access="public" data-area="dev">
  <div class="outbox-wrap">
    <div class="outbox-header">
      <h1><i class="fa-solid fa-envelope-open-text"></i> Simulated Mail Outbox</h1>
      <button class="btn-clear" id="btn-clear-outbox"><i class="fa-solid fa-trash"></i> Clear Outbox</button>
    </div>
    <div class="outbox-list" id="mail-list">
      <!-- Populated dynamically from localStorage -->
    </div>
  </div>

  <script type="module">
    function loadOutbox() {
      const listEl = document.getElementById('mail-list');
      const raw = localStorage.getItem('ameza_mail_outbox');
      let mails = [];
      try { mails = raw ? JSON.parse(raw) : []; } catch (e) {}

      if (!mails.length) {
        listEl.innerHTML = '<div class="outbox-empty"><i class="fa-solid fa-inbox" style="font-size: 32px; color: #CBD5E1; margin-bottom: 12px; display: block;"></i>No simulated emails sent yet. Trigger auth or order events to populate.</div>';
        return;
      }

      listEl.innerHTML = mails.map(m => `
        <div class="mail-item">
          <div>
            <div class="mail-to"><i class="fa-regular fa-envelope" style="color: #7DBA35; margin-right: 6px;"></i> To: ${m.to || 'user@example.com'}</div>
            <div class="mail-sub"><strong>${m.subject || 'Notification'}</strong> &bull; ${m.bodySnippet || ''}</div>
          </div>
          <div class="mail-time">${m.timestamp || 'Just now'}</div>
        </div>
      `).join('');
    }

    document.getElementById('btn-clear-outbox')?.addEventListener('click', () => {
      localStorage.removeItem('ameza_mail_outbox');
      loadOutbox();
    });

    loadOutbox();
  </script>
</body>
</html>
