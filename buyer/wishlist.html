<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | AMEZA Account</title>
  <meta name="description" content="View and manage your saved wishlist items.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/buyer/css/account.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/base.css">
<body class="buyer" data-layout="storefront" data-access="buyer" data-area="buyer">
  <div id="site-header"></div>

  

  

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content">

          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                Saved Wishlist
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <span id="wishlist-count-badge" class="twofa-status-badge disabled-badge"></span>
                <a href="wishlist.html" class="btn-section-action secondary" style="font-size: 0.8rem; padding: 6px 14px; text-decoration: none;">Full View</a>
              </div>
            </div>
            <div class="account-card-body">
              <div id="account-wishlist-container">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Page Bootstrap Module -->
  <script type="module" src="/buyer/js/pages/wishlist.js"></script>
</body>
</html>
