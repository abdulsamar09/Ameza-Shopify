<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information | AMEZA Account</title>
  <meta name="description" content="Manage your personal information and account details.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/buyer/css/account.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/base.css">
<body class="buyer" data-layout="storefront" data-access="buyer" data-area="buyer">
  <div id="site-header"></div>

  

  

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content">

          <!-- Profile Card -->
          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Personal Information
              </div>
            </div>
            <div class="account-card-body">

              <div class="auth-alert" id="profile-alert" role="alert" aria-live="polite">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
                <span id="profile-alert-msg"></span>
              </div>

              <form id="profile-form" novalidate>
                <div class="account-form-row">
                  <div class="account-form-group">
                    <label for="profile-firstname">First Name</label>
                    <input type="text" id="profile-firstname" class="account-input" required>
                  </div>
                  <div class="account-form-group">
                    <label for="profile-lastname">Last Name</label>
                    <input type="text" id="profile-lastname" class="account-input" required>
                  </div>
                </div>

                <div class="account-form-group">
                  <label>Email Address</label>
                  <input type="email" id="profile-email" class="account-input" readonly style="background: var(--border-subtle); cursor: not-allowed; opacity: 0.7;">
                  <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;" id="email-verified-note"></div>
                </div>

                <div class="account-form-group">
                  <label for="profile-phone">Phone Number</label>
                  <input type="tel" id="profile-phone" class="account-input" placeholder="+1 (555) 000-0000">
                </div>

                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
                  <button type="submit" class="btn-section-action" id="btn-save-profile" aria-label="Save profile changes">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <span id="btn-save-label">Save Changes</span>
                  </button>
                  <button type="button" class="btn-section-action secondary" id="btn-cancel-profile">Cancel</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Change Email Section -->
          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                Change Email Address
              </div>
            </div>
            <div class="account-card-body">
              <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">Changing your email address will require you to verify the new address before it becomes active.</p>

              <div class="auth-alert" id="email-change-alert" role="alert" aria-live="polite">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>
                <span id="email-change-alert-msg"></span>
              </div>

              <form id="change-email-form" novalidate>
                <div class="account-form-group">
                  <label for="new-email">New Email Address</label>
                  <input type="email" id="new-email" class="account-input" placeholder="newemail@example.com">
                </div>
                <div class="account-form-group">
                  <label for="email-change-password">Current Password (required)</label>
                  <input type="password" id="email-change-password" class="account-input" placeholder="Enter your current password">
                </div>
                <button type="submit" class="btn-section-action" aria-label="Update email address">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path></svg>
                  Update Email
                </button>
              </form>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Page Bootstrap Module -->
  <script type="module" src="/buyer/js/pages/profile.js"></script>
</body>
</html>
