<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Returns Hub | AMEZA Seller Central</title>
  <meta name="description" content="Manage buyer return requests, inspection clearances, partial refunds, and dispute escalations.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/dashboard.css">
  <link rel="icon" type="image/png" href="/assets/ameza-logo.png">
  <style>
    /* Scoped Returns Hub Styles */
    .returns-two-pane-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .returns-list-scroll {
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .returns-lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .btn-close-lightbox {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-size: 36px;
      line-height: 1;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .returns-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(2px);
      z-index: 5000;
      overflow-y: auto;
      padding: 20px;
    }

    /* Badges */
    .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-info { background: #DBEAFE; color: #1E40AF; }
    .badge-primary { background: #E0E7FF; color: #3730A3; }
    .badge-success { background: #D1FAE5; color: #065F46; }
    .badge-danger { background: #FEE2E2; color: #991B1B; }
    .badge-purple { background: #EDE9FE; color: #5B21B6; }

    /* Responsive under 900px */
    @media (max-width: 900px) {
      .returns-two-pane-layout {
        grid-template-columns: 1fr;
      }
      .returns-detail-pane {
        display: none;
      }
      .detail-mobile-back-bar {
        display: block !important;
      }
      .returns-list-scroll {
        max-height: none;
      }
    }

    @media (max-width: 640px) {
      .returns-kpi-grid {
        grid-template-columns: 1fr !important;
      }
      .returns-sticky-action-bar {
        flex-direction: column !important;
        align-items: stretch !important;
      }
      .returns-sticky-action-bar > div {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .returns-sticky-action-bar button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body data-layout="none" data-access="seller" data-area="seller">
  <!-- Top Bar (Shell injected) -->
  <header id="app-topbar"></header>

  <!-- Application Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation (Shell injected) -->
    <aside id="app-sidebar"></aside>

    <!-- Main Content Canvas -->
    <main class="main-content" id="main-content-region" role="main">
      <div id="returns-content-container">
        <!-- Rendered dynamically by js/returns.js -->
        <div class="dashboard-skeleton-wrap" style="padding: 20px;">
          <div style="height: 32px; width: 220px; background: var(--border); border-radius: 6px; margin-bottom: 20px;"></div>
          <div style="display: grid; grid-template-columns: 380px 1fr; gap: 20px;">
            <div style="height: 500px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;"></div>
            <div style="height: 500px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Application Bootstrap Script (ES Modules) -->
  <script type="module">
    import { initShell } from "/seller/js/dashboard-shell.js";
    import { initReturns } from "/seller/js/returns.js";

    // Initialize reusable shell with 'returns' as active page
    initShell('returns');

    // Initialize Returns Two-Pane Workflow
    initReturns();
  </script>
</body>
</html>
