<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discounts & Promotions | AMEZA Seller Central</title>
  <meta name="description" content="Create and manage coupon codes, promotional sales, and checkout cart discounts.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="icon" type="image/png" href="../assets/ameza-logo.png">
</head>
<body data-layout="none">
  <!-- Top Bar (Shell injected) -->
  <header id="app-topbar"></header>

  <!-- Application Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation (Shell injected) -->
    <aside id="app-sidebar"></aside>

    <!-- Main Content Canvas -->
    <main class="main-content" id="main-content-region" role="main">
      <div id="discounts-content-container">
        <!-- Rendered by js/discounts.js -->
      </div>
    </main>
  </div>

  <!-- Application Bootstrap Script (ES Modules) -->
  <script type="module">
    import { initShell } from '../js/shell.js';
    import { initDiscounts } from '../js/discounts.js';

    // Initialize reusable shell with 'discounts' as active page
    initShell('discounts');

    // Initialize Discounts table, search, filters, and actions
    initDiscounts();
  </script>
</body>
</html>
