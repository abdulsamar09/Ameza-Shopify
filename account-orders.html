<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | AMEZA Account</title>
  <meta name="description" content="View and manage your AMEZA order history.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="icon" type="image/png" href="assets/amezashopify logo.png">
</head>
<body>

  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-left"><span class="top-bar-badge"><i class="fa-solid fa-tag"></i> Special Offer</span><span>Free Worldwide Express Shipping on all orders over $100 &bull; 30-Day Easy Returns</span></div>
      <div class="top-bar-right"><a href="account-orders.html" class="top-bar-link"><i class="fa-solid fa-clipboard-list"></i> Track Order</a><span style="opacity:0.4;">|</span><span class="top-bar-link"><i class="fa-solid fa-globe"></i> USD ($)</span></div>
    </div>
  </div>

  <header class="header-sticky">
    <div class="container header-inner">
      <a href="index.html" class="logo-wrap"><img src="assets/amezashopify logo.png" alt="AMEZA" onerror="this.style.display='none'"></a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link"><svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a>
        <a href="index.html#section-clothes-jewellery" class="nav-link"><span>Clothing</span></a>
        <a href="index.html#section-electronics-watches" class="nav-link"><span>Electronics</span></a>
      </nav>
      <div class="header-actions">
        <a href="account.html" class="action-btn" title="My Account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        <a href="wishlist.html" class="action-btn" title="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
        <button class="action-btn hamburger-btn" data-action="mobile-menu-toggle" aria-label="Toggle Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="account-page-wrapper">
    <div class="container">
      <button class="account-mobile-nav-toggle" id="account-mobile-nav-toggle">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="account-layout">
        <aside class="account-sidebar" id="account-sidebar"></aside>
        <main class="account-content">

          <div class="account-card">
            <div class="account-card-header">
              <div class="account-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path></svg>
                Order History
              </div>
              <span id="order-count-badge" class="twofa-status-badge disabled-badge"></span>
            </div>
            <div id="orders-container">
              <!-- Populated by JS -->
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <footer class="footer-main" style="padding: 24px 0;"><div class="container"><div class="footer-bottom" style="border-top:none;padding-top:0;"><p>&copy; 2026 AMEZA. All rights reserved.</p><p class="footer-powered">Powered by <a href="https://techsyentra.com" target="_blank">techsyentra.com</a></p></div></div></footer>
  <div class="account-toast-container" id="account-toast-container"></div>

  <!-- Currency Engine -->
  <script src="js/currency.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account-ui.js"></script>
  <script>
    const Auth = window.AmezaAuth;
    const UI = window.AccountUI;
    const user = UI.requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('account-sidebar').innerHTML = UI.sidebarHTML(user, 'orders');
    UI.initMobileSidebar();
    document.getElementById('sidebar-logout-btn').addEventListener('click', async () => {
      if (await UI.confirm({ title: 'Sign Out', description: 'Sign out?', confirmText: 'Sign Out', cancelText: 'Stay' })) {
        Auth.logout(); window.location.href = 'index.html';
      }
    });

    const orders = Auth.getOrders(user.id);
    document.getElementById('order-count-badge').textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''}`;

    const container = document.getElementById('orders-container');
    if (orders.length === 0) {
      container.innerHTML = `
        <div class="account-empty-state">
          <div class="account-empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path></svg>
          </div>
          <h3>No orders yet</h3>
          <p>Your order history will appear here once you've made a purchase.</p>
          <a href="index.html" class="btn-section-action">Start Shopping</a>
        </div>`;
    } else {
      container.innerHTML = orders.map(o => `
        <div class="order-row">
          <div>
            <div class="order-id">#${o.id}</div>
            <div class="order-date">${UI.formatDate(o.createdAt || o.date)}</div>
          </div>
          <div class="order-items-preview">${Array.isArray(o.items) ? o.items.map(i => i.name || i).slice(0,3).join(', ') + (o.items.length > 3 ? ' +more' : '') : '—'}</div>
          <div>${UI.statusBadge(o.status || 'Processing')}</div>
          <div>
            <div class="order-total">${UI.formatPrice(o.total || 0)}</div>
            <div style="font-size: 0.72rem; color: var(--text-muted);">${o.paymentStatus || 'Paid'}</div>
          </div>
          <a href="account-order-detail.html?id=${encodeURIComponent(o.id)}" class="btn-view-order">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            View Order
          </a>
        </div>`).join('');
    }
  </script>
</body>
</html>
